packages:
  - "apps/*"
  - "packages/*"

# Which dependencies' install scripts may run — pnpm 11's per-dep decision
# map. Values carried over from the product repo's decisions at the migration
# sha; all four here build a required native/platform artifact. `sharp`
# joined with the devtools package (Wave 2, stage A1) — it renders club
# images and needs its platform binary fetched at install time, same reason
# it is `true` in the product repo's own list.
allowBuilds:
  # apps/platform (moved from the product repo, TASK-486): the Sentry CLI
  # fetches its platform binary at install time, and the supabase CLI's
  # postinstall downloads the CLI binary the local stack and `types:db` run.
  "@sentry/cli": true
  supabase: true
  # core-js (via @bitwarden/cli, devtools) postinstalls a funding banner and
  # nothing the package needs to work — `false` here is a decision, matching
  # the product repo's own, not an omission.
  core-js: false
  esbuild: true
  # vsce-sign's postinstall fetches a native binary that only `vsce
  # verify-signature` / `generate-manifest` call; `vsce package` and `vsce
  # publish` (what CI runs) load the module without it. Checked against
  # vsce 4.0.0's out/package.js. Turn it on only if we start signing.
  "@vscode/vsce-sign": false
  playwright-chromium: true
  sharp: true
  unrs-resolver: true
  workerd: true

# Single source of truth for every dependency used by more than one workspace
# package (and for the pinned-on-purpose ones used by exactly one). Packages
# reference these with "catalog:" instead of a literal range, so a shared
# version can only ever be bumped here. Values are kept in sync with the
# product repo's catalog, for every entry Backstage actually uses, as of
# DevDogsUGA@e5f8737a — see CUTOVER.md for what that marker means.
catalog:
  # --- Framework / runtime ---
  react: ^19.2.8
  react-dom: ^19.2.8

  # --- CLI ---
  # Exact, not a range: 1.8.x changed @clack/core's inferred return types
  # (isCancel/select's CANCEL_SYMBOL narrowing) in a way that breaks devtools'
  # `unwrap()` pattern across a couple dozen call sites. DevDogsUGA pins this
  # same exact version for the same reason.
  "@clack/prompts": 1.7.0

  # --- Supabase ---
  "@supabase/ssr": ^0.12.4
  "@supabase/supabase-js": ^2.112.3

  # --- Data ---
  # drizzle-orm stays pinned exact on the 1.0.0-rc line; the `latest`
  # dist-tag still points at 0.45.x, so a range here would silently downgrade.
  drizzle-orm: 1.0.0-rc.4
  postgres: ^3.4.9
  zod: 4.4.3

  # --- Observability ---
  # All @sentry/* JS packages ship in lockstep off the sentry-javascript
  # monorepo; pin every one used in this workspace to the same release.
  # Exact, not a range: devtools' @sentry/node has to resolve the SAME
  # @sentry/core instance this does, or their types (Client, Integration)
  # are structurally identical but nominally distinct, and every
  # Sentry.init() call site fails to typecheck. A caret range let pnpm pick
  # two different patch versions across the two dependents.
  "@sentry/core": 10.75.1
  "@sentry/node": 10.75.1

  # --- Styling ---
  tailwindcss: ^4.3.3

  # --- Toolchain ---
  # typescript is held at 6.x on purpose: typescript-eslint peer-requires
  # ">=4.8.4 <6.1.0", so TS 7 breaks linting in every package.
  eslint: ^9.39.5
  tsx: ^4.23.12
  typescript: ^6.0.3

  # --- Testing ---
  # vitest is held at 4.x on purpose: 5.x is still on the beta dist-tag.
  "@testing-library/jest-dom": ^7.0.1
  "@vitest/coverage-v8": ^4.1.11
  vitest: ^4.1.11

  # --- Types ---
  "@types/node": ^26.2.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4

  # --- Platform (apps/platform, packages/email; moved from the product repo
  # with the same ranges and the same reasons) ---
  next: 16.3.8
  # Radix stays on one release train even where a package is used by only one
  # app: mixing trains duplicates the shared internals (dismissable-layer,
  # popper, portal) in the bundle.
  "@radix-ui/react-alert-dialog": ^1.1.23
  "@radix-ui/react-avatar": ^1.2.6
  "@radix-ui/react-collapsible": ^1.1.20
  "@radix-ui/react-dialog": ^1.1.23
  "@radix-ui/react-dropdown-menu": ^2.1.24
  "@radix-ui/react-popover": ^1.1.23
  "@radix-ui/react-select": ^2.3.7
  "@radix-ui/react-tooltip": ^1.2.16
  radix-ui: ^1.6.7
  "@tanstack/react-query": ^5.101.4
  date-fns: ^4.4.0
  motion: ^12.43.0
  drizzle-kit: 1.0.0-rc.4
  "@sentry/cloudflare": 10.75.1
  "@sentry/nextjs": 10.75.1
  "@tailwindcss/forms": ^0.5.11
  "@tailwindcss/postcss": ^4.3.3
  postcss: ^8.5.26
  # Bumped off 4.133.0 in the product repo: the @cloudflare/vite-plugin that
  # vinext init pulls in declares a ^4.136.1 peer, and `vinext build` refuses
  # to load config below that.
  wrangler: ^4.136.3
  # jsdom is held at 29.x on purpose: 30.x raises its floor to node
  # ^22.22.2 || ^24.15.0 || >=26, which is narrower than engines.node.
  jsdom: ^29.1.1
  "@testing-library/react": ^16.3.2
  "@testing-library/user-event": ^14.6.5

