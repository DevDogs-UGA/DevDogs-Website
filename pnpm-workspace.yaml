  - sharp
  - supabase
  - unrs-resolver
  - workerd

# Run package.json scripts through pnpm's built-in JS shell (@yarnpkg/shell)
# instead of the platform shell, matching the product repo: it implements the
# POSIX subset these scripts need ($VAR, &&, >, KEY=VALUE prefixes)
# identically on Windows and POSIX. Note it also globs unquoted [...]
# patterns; keep such arguments quoted.
shellEmulator: true

# apps/platform's patches to vinext and React, carried over from the product
# repo (which keeps its own copies for schedule-builder). Why each exists and
# when to drop it: patches/patches.json. The patches are keyed to exact
# versions, so apps/platform pins react and react-dom to 19.2.8 (the rest of
# the workspace follows the catalog's ^19.2.8, which resolves to 19.3.x); drop
# the pins together with the react patches.
patchedDependencies:
  '@vinext/cloudflare@1.0.1': patches/@vinext__cloudflare@1.0.1.patch
  react-dom@19.2.8: patches/react-dom@19.2.8.patch
  react-server-dom-webpack@19.3.0: patches/react-server-dom-webpack@19.3.0.patch
  react@19.2.8: patches/react@19.2.8.patch

# undici 6 (via @discordjs/rest) starts compiling its llhttp Wasm AT MODULE
# SCOPE -- `llhttpPromise = lazyllhttp()` guarded by an argument-LESS
# `.catch()`, which swallows nothing -- and the Workers runtime forbids
# runtime Wasm codegen, so merely importing the library rejected every
# platform page render with an unhandled CompileError (2026-08-20). undici 7
# instantiates llhttp lazily and synchronously on first socket connect,
# which the fetch-based transports never reach. @discordjs/rest uses only
# Headers/request/FormData -- all unchanged in 7 -- and cheerio already pulls
# 7.28 into this tree.
#
# satori pins fflate to exactly 0.7.3 (still true in satori 0.35), whose
# unzipSync can loop forever on a malformed ZIP64 archive (GHSA-px8p-9vwx-vf98).
# satori only inflates the fonts we bundle, but 0.7.5 is the same API with the
# fix, so release the pin until satori moves.
overrides:
  undici: ^7.29.1
  fflate: ~0.7.5
