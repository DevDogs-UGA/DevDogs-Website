name: Deploy

# Every main commit is validated and staged immediately, then becomes a
# production candidate. Production mutation is gated by the protected
# `production` environment and deploys this commit's prebuilt artifacts.
#
# This is DevDogsUGA's deploy flow, moved here with the platform (TASK-478,
# TASK-489). What is different from there:
#
#   * Two repositories. This commit is deployed together with the DevDogsUGA
#     commit in `devdogsuga.lock`: migrations, seeds, avatars, docs and
#     schedule-builder come from that checkout (`devdogsuga/`), the platform
#     and `workers.json` from this one. Every job that installs the workspace
#     checks it out (setup-workspace does).
#   * The CLI is built from this commit (`.github/actions/backstage-cli`), not
#     fetched with `pnpm dlx`.
#   * The artifacts come from the merge queue. ci.yaml's `merge_group` run
#     builds both tiers (build-artifacts.yaml); `resolve` finds that run for
#     this exact SHA and the deploy jobs download its artifacts. A push the
#     queue never built (an admin bypass) is built here instead.
#   * Release names. The platform's Sentry release is this commit's SHA;
#     schedule-builder's is the DevDogsUGA commit it was built from.
#   * `production` opens with a self-approval gate (see approval-gate.mjs).
#
# ⚠️ PHASE GATE (TASK-489). Until TASK-491, production still deploys from
# DevDogsUGA's frozen copy of this flow, and this one deploys STAGING only. Every
# production job (and the production build) is off unless the repository
# variable BACKSTAGE_DEPLOYS_PRODUCTION is exactly `true`. Flipping it is the
# production cutover; see README, "Deploys".
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      prune_orphans:
        description: Delete undeclared production Worker secrets instead of deploying.
        type: boolean
        default: false

permissions:
  contents: read
  actions: write
  pull-requests: read

env:
  DEPLOY_ENV: staging

jobs:
  supersede:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Cancels an older CI run only when everything it is waiting on is a
      # production approval. This repo's CI run also carries the `publish`
      # job, which waits on its own environment: a run with any other waiting
      # job is left alone (its production job refuses to deploy a commit that
      # is no longer main anyway). The jobs of a called workflow are named
      # `<caller job> / <job>`, hence the pattern.
      - name: Cancel only older candidates still waiting for approval
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yaml --branch main --event push \
            --limit 30 --json databaseId \
            --jq ".[] | select(.databaseId != ($CURRENT_RUN | tonumber)) | .databaseId" |
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            read -r production other < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
              --jq '[.jobs[] | select(.status == "waiting") | (.name | test("(^| / )production$"))] as $w
                    | "\($w | map(select(.)) | length) \($w | map(select(. | not)) | length)"')
            if [ "$production" -gt 0 ] && [ "$other" -eq 0 ]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel"
            fi
          done

  # What this deploy is made of, and where its artifacts are.
  resolve:
    if: github.event_name == 'push' && !inputs.prune_orphans
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lock_sha: ${{ steps.lock.outputs.sha }}
      tiers: ${{ steps.tiers.outputs.tiers }}
      merge_group_run: ${{ steps.queue.outputs.run }}
      # `true` when the tier has something to ship (deploy-needed.mjs); a tier
      # that would redeploy what is live is skipped, approval and all.
      staging: ${{ steps.needed.outputs.staging }}
      production: ${{ steps.needed.outputs.production }}
    steps:
      # Full history: deploy-needed diffs against each tier's last deploy.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Read devdogsuga.lock and its previous value
        id: lock
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          new=$(tr -d '[:space:]' < devdogsuga.lock)
          old=
          if [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]]; then
            old=$(gh api -H 'Accept: application/vnd.github.raw' \
              "repos/$GITHUB_REPOSITORY/contents/devdogsuga.lock?ref=$BEFORE" | tr -d '[:space:]' || true)
          fi
          echo "sha=$new" >> "$GITHUB_OUTPUT"
          {
            echo '### Deploy source'
            echo
            echo "Backstage: \`$GITHUB_SHA\`"
            if [ -n "$BEFORE" ] && [[ ! "$BEFORE" =~ ^0+$ ]]; then
              echo "Compare: https://github.com/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA"
            fi
            echo
            echo "DevDogsUGA: \`$new\`"
            if [ -z "$old" ]; then
              echo "Compare: unavailable (no previous \`devdogsuga.lock\`)"
            elif [ "$old" = "$new" ]; then
              echo "Compare: unchanged since the previous commit"
            else
              echo "Compare: https://github.com/DevDogsUGA/DevDogsUGA/compare/$old...$new"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # Production's artifacts are only built, and only required, once
      # production deploys from here.
      - name: Choose the tiers to deploy
        id: tiers
        env:
          PRODUCTION: ${{ vars.BACKSTAGE_DEPLOYS_PRODUCTION }}
        run: |
          if [ "$PRODUCTION" = true ]; then
            echo 'tiers=["staging","production"]' >> "$GITHUB_OUTPUT"
            echo 'csv=staging,production' >> "$GITHUB_OUTPUT"
          else
            echo 'tiers=["staging"]' >> "$GITHUB_OUTPUT"
            echo 'csv=staging' >> "$GITHUB_OUTPUT"
          fi
      # Compared with the commit each tier last deployed, not the previous
      # commit, and failing open: see the header of deploy-needed.mjs.
      - name: Anything to deploy?
        id: needed
        env:
          GH_TOKEN: ${{ github.token }}
          TIERS: ${{ steps.tiers.outputs.csv }}
        run: |
          set -euo pipefail
          node .github/scripts/deploy-needed.mjs --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" --tiers "$TIERS" 2> needed.log | tee -a "$GITHUB_OUTPUT"
          cat needed.log
          { echo; echo '### Tiers'; echo; sed 's/^/- /' needed.log; } >> "$GITHUB_STEP_SUMMARY"
      - name: Find the merge queue run that built this commit
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          TIERS: ${{ steps.tiers.outputs.csv }}
        run: |
          run=$(node .github/scripts/merge-group-run.mjs --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --tiers "$TIERS")
          echo "run=$run" >> "$GITHUB_OUTPUT"
          {
            echo
            echo '### Artifacts'
            echo
            if [ -n "$run" ]; then
              echo "Built by the merge queue: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run"
            else
              echo 'No merge queue run has artifacts for this commit; they are built in this run.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Only when the merge queue did not build this commit.
  build:
    needs: resolve
    if: >-
      needs.resolve.outputs.merge_group_run == ''
      && (needs.resolve.outputs.staging == 'true' || needs.resolve.outputs.production == 'true')
    uses: ./.github/workflows/build-artifacts.yaml
    with:
      tiers: ${{ needs.resolve.outputs.tiers }}

  staging-preflight:
    needs: resolve
    if: >-
      github.event_name == 'push'
      && !inputs.prune_orphans
      && needs.resolve.outputs.staging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    outputs:
      paused: ${{ steps.probe.outputs.paused }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/backstage-cli
      - name: Classify the staging Supabase project
        id: probe
        env:
          PROJECT_REF: ${{ vars.PROJECT_REF }}
          PUBLISHABLE_KEY: ${{ vars.PUBLISHABLE_KEY }}
        run: backstage deploy preflight --no-env --yes

  staging-migrate:
    needs: staging-preflight
    if: needs.staging-preflight.outputs.paused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/backstage-cli
      # Migrations, seeds and avatars are DevDogsUGA's, at the pinned commit
      # (devdogsuga/supabase). --include-seed runs the seed files staging has
      # not recorded yet; they are insert-only, so a rerun or an edited file
      # changes nothing there.
      - name: Apply staging migrations and new seeds
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: backstage deploy migrate --no-env --yes --include-seed
      # The seed SQL never touches Storage. This uploads only the headshots
      # the bucket lacks, so a photo an officer replaced is never overwritten.
      - name: Upload new seeded headshots
        env:
          API_URL: ${{ vars.API_URL }}
          PROJECT_REF: ${{ vars.PROJECT_REF }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: backstage deploy avatars --no-env --yes

  # The two Workers are independent deploy targets. One failing is worth
  # knowing about on its own; it is not a reason to leave the other on the
  # previous version.
  #
  # `!cancelled()` and explicit results: `build` is skipped whenever the merge
  # queue already built, and a skipped need would otherwise skip this job too.
  staging-deploy:
    needs: [resolve, build, staging-preflight, staging-migrate]
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && needs.resolve.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && needs.staging-preflight.outputs.paused != 'true'
      && needs.staging-migrate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      DEPLOY_ENV: staging
      # Lifted out of `secrets` here because the `secrets` context is not
      # available in a step `if:`; the gating steps below test it through `env`.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: platform
            dir: apps/platform
            release: ${{ github.sha }}
          # schedule-builder's code is DevDogsUGA's, so its Sentry release is
          # the DevDogsUGA commit it was built from (Q68).
          - app: schedule-builder
            dir: devdogsuga/apps/schedule-builder
            release: ${{ needs.resolve.outputs.lock_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/backstage-cli
      - name: Download the staging artifacts (built by the merge queue)
        if: needs.resolve.outputs.merge_group_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: staging-${{ github.sha }}
          path: .
          run-id: ${{ needs.resolve.outputs.merge_group_run }}
          github-token: ${{ github.token }}
      - name: Download the staging artifacts (built in this run)
        if: needs.resolve.outputs.merge_group_run == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: staging-${{ github.sha }}
          path: .
      - name: Verify exact artifact hashes
        run: sha256sum --check RELEASE_SHA256SUMS
      # The ONLY step in this job that reads the `secrets` and `vars` contexts.
      # After it, the checkout looks like a devops laptop and every later step
      # is the command a person would run by hand. Writes .env.staging here
      # and into devdogsuga/, where schedule-builder reads its own.
      #
      # ⚠️ --no-env: this step CREATES the file tier resolution would insist
      # on reading, so routing it through tier resolution would fail on a
      # missing env file for its own output.
      - name: Compose .env.staging from the environment
        env:
          DEPLOY_GITHUB_SECRETS: ${{ toJSON(secrets) }}
          DEPLOY_GITHUB_VARS: ${{ toJSON(vars) }}
        run: backstage deploy write-env --no-env --yes
      # The Sentry release action runs in its own container and never sees the
      # file above, so the org slug is lifted into the job environment for it
      # and the smoke test. `write-env` single-quotes every value, and
      # GITHUB_ENV keeps quotes literally, so both quote styles are stripped.
      - name: Export SENTRY_ORG from .env.staging
        run: grep -m1 '^SENTRY_ORG=' .env.staging | tr -d "\"'" >> "$GITHUB_ENV"
      # SENTRY_AUTH_TOKEN absent means the Sentry org is not onboarded: a
      # visible skip. Present and failing must fail the job.
      - name: Sentry release skipped (SENTRY_AUTH_TOKEN not configured)
        if: env.SENTRY_AUTH_TOKEN == ''
        run: echo "::warning::Sentry release for ${{ matrix.app }} skipped — SENTRY_AUTH_TOKEN is not configured (org not onboarded yet)."
      - name: Create Sentry release and upload source maps (${{ matrix.app }})
        if: env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_PROJECT: ${{ matrix.app }}
        with:
          environment: staging
          release: ${{ matrix.release }}
          set_commits: skip
          # vinext writes maps under both `dist/client` and `dist/server`.
          sourcemaps: ${{ matrix.dir }}/dist
      # `backstage deploy <app>` is the whole Worker deploy: it refuses without
      # CLOUDFLARE_API_TOKEN, writes the Worker's secrets file from the app's
      # manifest, runs `wrangler deploy` in the app's own directory (the
      # artifact's config redirect resolves the built Worker) and removes the
      # file again. SENTRY_RELEASE reaches the Worker as a `--var`.
      - name: Deploy ${{ matrix.app }}
        env:
          SENTRY_RELEASE: ${{ matrix.release }}
        run: backstage deploy ${{ matrix.app }} --tier staging --yes
      # The docs search index lives in the platform's database, written from
      # the docs the artifact carries (devdogsuga/docs/dist). After the deploy
      # rather than before: the index should not describe pages the previous
      # Worker cannot render yet. `populate:search` runs through `with-env`, so
      # it reads devdogsuga/.env.staging for the database URL.
      - name: Index the docs for search
        if: matrix.app == 'platform'
        run: pnpm --dir devdogsuga --filter @devdogsuga/docs run populate:search
      # Reconciles meetings/workshops against @devdogsuga/events the moment
      # this deploy's code is live; it waits for the Worker that carries this
      # commit's SHA (the platform's SENTRY_RELEASE). Platform only: the
      # config is the platform's, and schedule-builder serves no such route.
      - name: Reconcile meetings/workshops from @devdogsuga/events
        if: matrix.app == 'platform'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: backstage deploy reconcile --tier staging --no-env --yes
      # Read-only smoke test of the Worker just deployed. The Sentry release it
      # looks for is read from GITHUB_SHA, which is this commit for the
      # platform and the DevDogsUGA commit for schedule-builder, so it is set
      # on the command rather than on the step (the runner owns GITHUB_*).
      - name: Smoke test ${{ matrix.app }} (staging)
        env:
          SENTRY_PROJECT: ${{ matrix.app }}
          RELEASE: ${{ matrix.release }}
        run: >-
          GITHUB_SHA="$RELEASE" backstage deploy smoke --tier staging --yes
          --app ${{ matrix.app }} --no-env

  production-plan:
    needs: resolve
    if: >-
      github.event_name == 'push'
      && !inputs.prune_orphans
      && vars.BACKSTAGE_DEPLOYS_PRODUCTION == 'true'
      && needs.resolve.outputs.production == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preflight
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/backstage-cli
      - name: Verify the migration planner credential is read-only
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: backstage planner status --no-env --yes
      - name: Plan production migrations
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: >-
          backstage deploy plan --no-env --yes --include-seed
          --label 'Migration plan — production candidate'

  production:
    needs: [supersede, resolve, build, staging-deploy, production-plan]
    if: >-
      github.event_name == 'push'
      && !cancelled()
      && vars.BACKSTAGE_DEPLOYS_PRODUCTION == 'true'
      && needs.resolve.result == 'success'
      && needs.resolve.outputs.production == 'true'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.staging-deploy.result == 'success' || needs.resolve.outputs.staging == 'false')
      && needs.production-plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: production
      cancel-in-progress: false
    environment: production
    env:
      DEPLOY_ENV: production
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # The platform's release. schedule-builder's step overrides it with the
      # DevDogsUGA commit.
      SENTRY_RELEASE: ${{ github.sha }}
      LOCK_SHA: ${{ needs.resolve.outputs.lock_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # FIRST, before anything changes (Q61): whoever approved this deployment
      # is neither the author of the PR that produced the commit nor the person
      # who queued it. A push with no PR (an admin bypass) is covered by the
      # environment's own prevent-self-review.
      - name: Refuse an approver who wrote or queued this change
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node .github/scripts/approval-gate.mjs
          --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --sha "$GITHUB_SHA"
          --environment production
      - name: Refuse an approved candidate that is no longer main
        id: freshness
        run: |
          set -euo pipefail
          latest=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::notice::Candidate $GITHUB_SHA was superseded by $latest; nothing was changed."
            echo 'fresh=false' >> "$GITHUB_OUTPUT"
          else
            echo 'fresh=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup-workspace
        if: steps.freshness.outputs.fresh == 'true'
      - uses: ./.github/actions/backstage-cli
        if: steps.freshness.outputs.fresh == 'true'
      - name: Download approved production candidate (built by the merge queue)
        if: steps.freshness.outputs.fresh == 'true' && needs.resolve.outputs.merge_group_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-${{ github.sha }}
          path: .
          run-id: ${{ needs.resolve.outputs.merge_group_run }}
          github-token: ${{ github.token }}
      - name: Download approved production candidate (built in this run)
        if: steps.freshness.outputs.fresh == 'true' && needs.resolve.outputs.merge_group_run == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-${{ github.sha }}
          path: .
      - name: Verify exact artifact hashes
        if: steps.freshness.outputs.fresh == 'true'
        run: sha256sum --check RELEASE_SHA256SUMS
      - name: Compose the production runtime environment
        if: steps.freshness.outputs.fresh == 'true'
        env:
          DEPLOY_GITHUB_SECRETS: ${{ toJSON(secrets) }}
          DEPLOY_GITHUB_VARS: ${{ toJSON(vars) }}
        run: backstage deploy write-env --no-env --yes
      # The Sentry release action runs in its own container and never sees the
      # file above, so the org slug is lifted into the job environment for it,
      # the smoke tests and the monitor prune.
      - name: Export SENTRY_ORG from .env.production
        if: steps.freshness.outputs.fresh == 'true'
        run: grep -m1 '^SENTRY_ORG=' .env.production | tr -d "\"'" >> "$GITHUB_ENV"
      - name: Revalidate and apply migrations and new seeds
        if: steps.freshness.outputs.fresh == 'true'
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          backstage deploy plan --no-env --yes --include-seed --label 'Approved migration plan — production'
          backstage deploy migrate --no-env --yes --include-seed
      - name: Upload new seeded headshots
        if: steps.freshness.outputs.fresh == 'true'
        env:
          API_URL: ${{ vars.API_URL }}
          PROJECT_REF: ${{ vars.PROJECT_REF }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: backstage deploy avatars --no-env --yes
      # `supabase/` and the CLI are DevDogsUGA's, and so is the env file this
      # reads (write-env mirrored it into devdogsuga/).
      - name: Apply Supabase configuration
        if: steps.freshness.outputs.fresh == 'true'
        working-directory: devdogsuga
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec with-env -c 'supabase config push --project-ref $PROJECT_REF'
      - name: Create Sentry release and upload platform source maps
        if: steps.freshness.outputs.fresh == 'true' && env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_PROJECT: platform
        with:
          environment: production
          release: ${{ github.sha }}
          set_commits: skip
          sourcemaps: apps/platform/dist
      - name: Deploy and verify platform
        if: steps.freshness.outputs.fresh == 'true'
        run: |
          backstage deploy platform --tier production --yes
          pnpm --dir devdogsuga --filter @devdogsuga/docs run populate:search
      - name: Reconcile production configuration
        if: steps.freshness.outputs.fresh == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: backstage deploy reconcile --tier production --no-env --yes
      - name: Smoke test platform
        if: steps.freshness.outputs.fresh == 'true'
        env:
          SENTRY_PROJECT: platform
        run: backstage deploy smoke --tier production --yes --app platform --no-env
      # Deletes the Sentry Crons monitors the app no longer declares in
      # `cloudflare/scheduled.ts`. Sentry never removes a monitor itself.
      # After the smoke test, so it only runs once this deploy's cron triggers
      # are live. Production only: staging deploys `main`, which can drop a
      # monitor production still checks in to.
      #
      # SENTRY_MONITORS_TOKEN is in the step's `env:` alone, not the job's: it
      # can delete monitors and alert rules org-wide. Without it the step
      # skips with a notice.
      - name: Prune Sentry monitors for platform
        if: steps.freshness.outputs.fresh == 'true'
        env:
          SENTRY_MONITORS_TOKEN: ${{ secrets.SENTRY_MONITORS_TOKEN }}
        run: backstage deploy prune-monitors --tier production --yes --app platform --no-env
      - name: Create Sentry release and upload schedule-builder source maps
        if: steps.freshness.outputs.fresh == 'true' && env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_PROJECT: schedule-builder
        with:
          environment: production
          release: ${{ needs.resolve.outputs.lock_sha }}
          set_commits: skip
          sourcemaps: devdogsuga/apps/schedule-builder/dist
      - name: Deploy and verify schedule-builder
        if: steps.freshness.outputs.fresh == 'true'
        env:
          SENTRY_RELEASE: ${{ needs.resolve.outputs.lock_sha }}
        run: backstage deploy schedule-builder --tier production --yes
      # GITHUB_SHA set on the command: the smoke test looks for the Sentry
      # release under it, and schedule-builder's release is the DevDogsUGA commit.
      - name: Smoke test schedule-builder
        if: steps.freshness.outputs.fresh == 'true'
        env:
          SENTRY_PROJECT: schedule-builder
        run: >-
          GITHUB_SHA="$LOCK_SHA" backstage deploy smoke --tier production --yes
          --app schedule-builder --no-env
      - name: Prune Sentry monitors for schedule-builder
        if: steps.freshness.outputs.fresh == 'true'
        env:
          SENTRY_MONITORS_TOKEN: ${{ secrets.SENTRY_MONITORS_TOKEN }}
        run: backstage deploy prune-monitors --tier production --yes --app schedule-builder --no-env
      - name: Report orphaned Worker secrets
        if: steps.freshness.outputs.fresh == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: backstage env audit --target production --no-env --yes

  prune-orphans:
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.prune_orphans
      && vars.BACKSTAGE_DEPLOYS_PRODUCTION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/backstage-cli
      - name: Prune orphaned Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: backstage env audit --target production --prune --yes --no-env
