name: CI

# Pull requests and merge-queue runs validate and build, and hold no secret:
# nothing there needs a credential to prove it works. Every package's `test`
# script is expected to be credential-free by construction; a script that
# genuinely needs a live service is named something other than `test` for
# exactly that reason and is NOT run here.
#
# A push to `main` additionally hands the commit to the deploy workflow once
# validation has passed (`deploy` below, TASK-489). That is the one place
# credentials are in scope, behind the deploy workflow's protected
# environments, and the reason a pull request's own copy of this file can
# never reach one: on `pull_request`, GitHub runs the workflow definition FROM
# THE PULL REQUEST, so nothing it can run holds a secret.
#
# INERT UNTIL A REMOTE EXISTS. This workflow is authored ahead of the GitHub
# remote and the `@devdogsuga` npm org being claimed (see the parent plan,
# Phase 0) — `pull_request`/`push` simply never fire with no remote to host
# them. Once the remote exists this needs no further edits to start running;
# review it now on the assumption that it does.
#
# Same reasoning as DevDogsUGA's ci.yaml for what's absent: on `pull_request`,
# GitHub runs the workflow definition FROM THE PULL REQUEST, not from the
# protected branch, so any credential in scope here is readable by whoever
# opened the PR. Actions are pinned to full commit SHAs rather than tags for
# the same reason DevDogsUGA's are — a tag is mutable.
#
# `merge_group` is what the merge queue on `main` waits for: a queued PR is
# merged only once `validate` passes on the exact commit the queue built
# (TASK-478). It has to be here before the queue is turned on, or every
# queued PR waits forever for a check that never starts. `publish` below
# stays push-only.
#
# The platform (apps/platform, packages/email) is built here but runs against
# DevDogsUGA: its database, docs and generated Supabase types stay there, at
# the commit pinned in devdogsuga.lock. Every job that installs the workspace
# therefore checks DevDogsUGA out at `devdogsuga/` first (setup-workspace does
# it). `validate` covers the platform's lint/typecheck/test and its Cloudflare
# types, `database` its build and database-backed tests, and `toolchain` keeps
# the dependency pins and patches in step with DevDogsUGA's copies.
#
# The `schedule` trigger exists only for `toolchain`'s upstream-patch audit
# (daily); every other job skips it.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"

concurrency:
  # A scheduled run must not share a group with the push to main it fires
  # beside, or one cancels the other. Main pushes cannot share a group at all:
  # once validation hands a commit to the deploy workflow, a later push must
  # not cancel a deployment that is already running.
  group: ci-${{ github.event_name == 'schedule' && 'schedule' || github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  # DevDogsUGA's generated Supabase `Database` type, for the jobs that
  # typecheck against it (`validate`, `database`).
  #
  # Newer DevDogsUGA commits stop committing `database.types.ts` and generate
  # it from the migrations instead (`pnpm --filter @devdogsuga/supabase run
  # codegen`, which needs a database). This job is the one place that does,
  # and only when the migrations it is keyed on changed: a hit is a checkout
  # and a cache restore, with no install and no stack. The other jobs restore
  # the result; `validate` in particular has no database and must not wait for
  # `database`, which is the slowest job here.
  #
  # A no-op while devdogsuga.lock points at a commit that still commits the
  # file (the package has no `codegen` script): nothing is generated or saved.
  types:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/checkout-devdogsuga
      - name: Does the pinned DevDogsUGA generate its types?
        id: pin
        run: |
          if node -e 'process.exit(require("./devdogsuga/packages/supabase/package.json").scripts?.codegen ? 0 : 1)'; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "The pinned DevDogsUGA commits database.types.ts; nothing to generate."
          fi
      - id: types
        if: steps.pin.outputs.generated == 'true'
        uses: ./.github/actions/restore-supabase-types
      # Everything below is the miss path: the migrations changed, so the
      # types are regenerated from a stack built from them.
      - if: steps.types.outputs.cache-hit != 'true' && steps.pin.outputs.generated == 'true'
        uses: ./.github/actions/setup-workspace
      - name: Seed the env file for wrapped checks
        if: steps.types.outputs.cache-hit != 'true' && steps.pin.outputs.generated == 'true'
        run: cp .github/ci.env .env
      - if: steps.types.outputs.cache-hit != 'true' && steps.pin.outputs.generated == 'true'
        uses: ./.github/actions/start-supabase
      # DB_URL is handed over explicitly rather than left for `with-env` to
      # find from the sibling's directory, which has no .env of its own.
      - name: Generate the Supabase types
        if: steps.types.outputs.cache-hit != 'true' && steps.pin.outputs.generated == 'true'
        run: |
          eval "$(pnpm --dir devdogsuga exec supabase status -o env | grep '^DB_URL=')"
          export DB_URL
          BACKSTAGE_SUPABASE_TYPES= node apps/platform/scripts/supabase-types.mjs
          test -s devdogsuga/packages/supabase/src/database.types.ts
      - name: Cache the Supabase types
        if: steps.types.outputs.cache-hit != 'true' && steps.pin.outputs.generated == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: devdogsuga/packages/supabase/src/database.types.ts
          key: ${{ steps.types.outputs.cache-primary-key }}

  # Build + typecheck + test every package in the workspace.
  validate:
    needs: types
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-workspace
      # The platform's typecheck and typed lint need DevDogsUGA's generated
      # Supabase types; this job has no database to generate them from.
      - uses: ./.github/actions/restore-supabase-types
      # Build before typecheck/test: packages import each other's `dist/`
      # (workspace:* deps), so an unbuilt sibling makes a downstream
      # typecheck or test fail on a missing module, not a real error.
      # Everything but apps/slides, whose build reads the private workshop
      # submodules; it builds in slides.yaml instead, so a slides problem
      # never blocks a publish (publish.yaml waits on this workflow).
      #
      # And apps/platform, whose build reads its whole environment (the
      # `database` job builds it, with a real stack and the schema enforced).
      - name: Build (workspace)
        run: pnpm -r --filter '!slides' --filter '!platform' --if-present run build
      - name: Lint (workspace)
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Script names follow the vocabulary
        run: pnpm check:scripts
      - name: Typecheck (workspace)
        run: pnpm -r --if-present run typecheck
      - name: Test (workspace)
        run: pnpm -r --if-present run test
      # devtools' contract tests (packages/devtools/test/contract) — a real
      # `pnpm pack` + `pnpm install` + subprocess run against a committed
      # fixture repo, per the carve-out plan's §8 risk mitigation. Separate
      # from `pnpm -r test` above because it is slow (a real install) and
      # was deliberately kept out of the default `test` script for that
      # reason; needs the build step above to have already produced
      # devtools'/telemetry's/env's `dist/`.
      - name: devtools contract tests
        run: pnpm --filter @devdogsuga/devtools run test:contract
      # backstage's, the same way: the packed tarball installed outside any
      # repo (it must start without a checkout, with install scripts off) and
      # inside the fixture repo. A bad publish reaches every officer and every
      # CI run through `pnpm dlx` at the latest version.
      - name: backstage contract tests
        run: pnpm --filter @devdogsuga/backstage run test:contract
      # `check:events` is its own script, not `test`, because it exercises the CLI
      # a config author actually runs (`pnpm --filter @devdogsuga/events
      # check:events`), not just the package's own vitest suite. Merge-blocking
      # here, matching how it gates merges in the product repo's ci.yaml.
      - name: Events config passes its publishability checks
        run: pnpm --filter @devdogsuga/events check:events
      # The platform's lint, typecheck and tests (and packages/email's) ran
      # above with the rest of the workspace. Their `pre*` hooks run the
      # platform's `codegen` (email templates, the docs module compiled from
      # devdogsuga/docs, the generated route types), so nothing is built
      # first. This one compares cloudflare-env.d.ts to what `wrangler types`
      # would write for the platform's wrangler.jsonc: a binding added to the
      # config and not the types typechecks everywhere until a Worker reads it.
      - name: Cloudflare binding types match the Worker configuration
        run: pnpm --filter platform run types:cf:check

  # The platform against a real Postgres: its query tests and its production
  # build with the env schema enforced.
  #
  # Credential-free like the rest of this file: the local stack's keys are the
  # well-known constants Supabase publishes in its own documentation, and
  # .github/ci.env holds only invented placeholders. Nothing here can reach a
  # real project.
  #
  # The stack starts from DevDogsUGA's `supabase/` at the pinned commit, so
  # this is also the check that the platform still works with the migrations it
  # is pinned to. Starting it applies every migration to a fresh database,
  # which fails if one does not apply. The migrations' own checks (RLS tests,
  # the generated Database types, timestamp order) stay in DevDogsUGA's CI.
  #
  # Unconditional rather than path-filtered, for the reason DevDogsUGA's was:
  # a security-relevant check that skips itself on a heuristic is how a job
  # ends up green without ever having run.
  database:
    needs: types
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-workspace
      # `test:db` and `build` run the platform's `codegen`, which would
      # otherwise regenerate the types against this job's own stack: the
      # `types` job already did, once, for every job.
      - uses: ./.github/actions/restore-supabase-types
      # The platform consumes its workspace dependencies (env, db, events,
      # newsletter, ...) from `dist/`, and `with-env` is one of them. Only the
      # platform itself is left out: it builds below, with its environment.
      - name: Build the platform's workspace dependencies
        run: pnpm --filter 'platform^...' --if-present run build
      # The `with-env` wrapper REFUSES a missing .env by design; the step after
      # the stack starts replaces this one and appends the generated values.
      - name: Seed the env file for wrapped checks
        run: cp .github/ci.env .env
      # Images cached and the stack started by the shared action; it applies
      # every migration to a fresh database, which fails if one does not apply.
      - uses: ./.github/actions/start-supabase
      # `with-env` reads .env.generated from this repo's root; the CLI writes
      # it from the stack that is running.
      - name: Write .env.generated from the running stack
        run: pnpm --dir devdogsuga exec supabase status -o env > .env.generated
      # The NEXT_PUBLIC pair is derived rather than hardcoded: it has to match
      # the running stack, and the CLI's local keys are not guaranteed stable
      # across versions.
      - name: Synthetic environment for the tests and the build
        run: |
          cp .github/ci.env .env
          set -a; . ./.env.generated; set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
          } >> .env
      # Including the privilege-surface guards in resolveCredential.db-test.ts,
      # which assert the shape of the GRANTS: a function reachable by every
      # role in the cluster typechecks perfectly. `test:db` runs the platform's
      # `codegen` first (`pretest:db`).
      - name: Query validity + privilege surface
        run: pnpm --filter platform run test:db
      # Validation ENFORCED, unlike the validate job: a newly added required
      # variable with no default fails here rather than at deploy time.
      - name: Build the platform, with the env schema enforced
        run: pnpm --filter platform run build

  # The toolchain is shared with DevDogsUGA, which still builds
  # schedule-builder and runs the database tooling with the same dependency
  # ranges and the same patches. Drift between the two is a hard failure; the
  # upstream-patch audit only warns.
  #
  # Needs no install: the scripts have no dependencies and Node (from .nvmrc)
  # strips their types itself, so they run with `node` directly (a `pnpm run`
  # here would first try to install the workspace). Only DevDogsUGA's checkout.
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/checkout-devdogsuga
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Catalog, overrides, patchedDependencies and patches/ match DevDogsUGA's
        run: node scripts/toolchain-drift.ts
      - name: Toolchain script tests
        run: node --test scripts/toolchain-drift.test.ts scripts/patch-audit.test.ts scripts/patch-issues.test.ts
      # The deploy workflow's two scripts (the production self-approval gate
      # and the merge-queue run lookup); no dependencies either.
      - name: Deploy script tests
        run: node --test .github/scripts/deploy-scripts.test.mjs
      # patches/patches.json against pnpm-workspace.yaml's patchedDependencies
      # and the files in patches/ (a mismatch fails here), then each patch's
      # upstream PRs/issues and the npm release that carries the fix. The
      # upstream half only warns (`::warning::` annotations when a patch can
      # be dropped, or when the API or npm can't be reached); it never fails
      # the job. The token only lifts the API's rate limit.
      - name: Patches are documented, and flagged when upstream fixes them
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/patch-audit.ts

  # Daily: one issue per patch that can now be removed. A job of its own so
  # that `issues: write` exists only on the scheduled run, which no pull
  # request can edit the definition of: the token above is read-only.
  patch-issues:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Audit the patches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/patch-audit.ts --json > patch-report.json
      - name: Open or update an issue for each removable patch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/patch-issues.ts patch-report.json

  publish:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish.yaml

  # The merge queue's candidate commit is built here, once per tier, and the
  # push to `main` that follows deploys these exact artifacts instead of
  # building again (deploy.yaml's `resolve` finds this run). Only after
  # `validate`: a commit that does not pass is not worth building. Not part of
  # the push run, where deploy.yaml builds only when the queue did not.
  build:
    needs: validate
    # Same staging gate as `deploy` below: nothing reads these artifacts
    # before the cutover, and `staging-build` has no variables until then.
    if: github.event_name == 'merge_group' && vars.BACKSTAGE_DEPLOYS_STAGING == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build-artifacts.yaml
    with:
      # Production is built only once it deploys from here (see deploy.yaml).
      tiers: ${{ vars.BACKSTAGE_DEPLOYS_PRODUCTION == 'true' && '["staging","production"]' || '["staging"]' }}

  # A main commit becomes a staging (and, once Backstage deploys production, a
  # production) candidate only after the required jobs pass. A reusable
  # workflow keeps the credential boundary: pull requests never call it, and
  # only this job receives the Actions write permission needed to supersede
  # older waiting candidates and the read of pull requests the production
  # approval gate needs.
  #
  # Off until the staging cutover (TASK-489): DevDogsUGA still deploys staging
  # from its frozen copy, and both deploying would race on the same Workers and
  # database. Set the repository variable BACKSTAGE_DEPLOYS_STAGING=true at the
  # moment DevDogsUGA's staging jobs are removed.
  deploy:
    needs: [validate, database, toolchain]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.BACKSTAGE_DEPLOYS_STAGING == 'true'
    permissions:
      contents: read
      actions: write
      pull-requests: read
    uses: ./.github/workflows/deploy.yaml
    secrets: inherit
