name: Destructive gate

# Who may apply the `allow-destructive` label (Q10). Runs on `pull_request_target`
# so its token can edit the pull request, which also means it must NEVER check
# out or run the pull request's code: the one script it runs comes from the
# base branch, and it reads only the PR number the event gives it.
#
# What it does:
#   * the label is on the pull request and its applier is not a `devops` member:
#     the check fails and the label is removed, so a stray label cannot sit
#     there looking approved;
#   * the pull request gets a new push (`synchronize`): the label is removed,
#     because it was applied to SQL a devops member read, and the SQL has
#     changed since. A devops member re-applies it after reading the new diff.
#
# The merge queue has no `pull_request_target`, so database-pr.yaml runs the
# same check there under the same name, `destructive-gate`.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: destructive-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  destructive-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # The base branch's copy of the script. No `ref:`: this event checks out
      # the base, not the pull request.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: A new push clears the label
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/allow-destructive" > /dev/null 2>&1 \
            && echo "Removed allow-destructive: the pull request changed after it was applied." >> "$GITHUB_STEP_SUMMARY" \
            || true
      - name: Who applied the allow-destructive label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: node .github/scripts/destructive-label.mjs gate --repo "$GITHUB_REPOSITORY" --pr "$PR" --remove-rejected | tee -a "$GITHUB_STEP_SUMMARY"
