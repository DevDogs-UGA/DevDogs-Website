name: Throwaway gate probe (live test of destructive-label.mjs gate, deleted after)
on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Who applied the allow-destructive label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: node .github/scripts/destructive-label.mjs gate --repo "$GITHUB_REPOSITORY" --pr "$PR" --remove-rejected | tee -a "$GITHUB_STEP_SUMMARY"
