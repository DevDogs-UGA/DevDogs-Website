# One-off: copies this repo's environment secrets into DevDogsUGA's matching
# environments for the fold-back, so the values never leave GitHub.
# Delete this file and the SECRETS_COPY_TOKEN secret after it runs.
name: Copy secrets to DevDogsUGA

on: workflow_dispatch

permissions: {}

jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - name: Copy repo-level secrets
        env:
          GH_TOKEN: ${{ secrets.SECRETS_COPY_TOKEN }}
          WORKSHOPS_READ_TOKEN: ${{ secrets.WORKSHOPS_READ_TOKEN }}
        run: |
          printf '%s' "$WORKSHOPS_READ_TOKEN" | gh secret set WORKSHOPS_READ_TOKEN -R DevDogsUGA/DevDogsUGA
          echo "copied WORKSHOPS_READ_TOKEN"

  environment:
    strategy:
      fail-fast: false
      matrix:
        environment: [production, staging, preflight]
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    steps:
      - name: Copy ${{ matrix.environment }} secrets
        env:
          GH_TOKEN: ${{ secrets.SECRETS_COPY_TOKEN }}
          TARGET_ENV: ${{ matrix.environment }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          skip = {"github_token", "SECRETS_COPY_TOKEN", "WORKSHOPS_READ_TOKEN"}
          env = os.environ["TARGET_ENV"]
          for name, value in sorted(json.loads(os.environ["ALL_SECRETS"]).items()):
              if name in skip:
                  continue
              subprocess.run(
                  ["gh", "secret", "set", name, "-R", "DevDogsUGA/DevDogsUGA", "--env", env],
                  input=value.encode(), check=True,
              )
              print(f"copied {env}/{name}")
          PY
